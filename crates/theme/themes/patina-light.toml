# Patina Light: paper with a hint of mint and teal ink. The accent is darker than the dark
# twin's (#0b7d6b), so white text on the cursor and buttons keeps 5:1.

name = "Patina Light"
appearance = "light"
opacity = 0.8

ansi = [
    "#13221f", "#c0362f", "#0b7a66", "#8f5c00", "#1679a8", "#7344b6", "#0b7480", "#586c66",
    "#3d524c", "#d13b33", "#2e7d1f", "#875800", "#22609a", "#7d4fc0", "#087a8f", "#62766f",
]

[colors]
bg-main = "#f7fbf9"
bg-popup = "#ebf3f0"
bg-kbd-selected = "#c8e8e0"

fg-main = "#13221f"
fg-body = "#23342f"
fg-kbd = "#3d524c"
fg-alt = "#0b2c26"
fg-dim = "#5a6f69"
fg-faint = "#6f847e"
fg-placeholder = "#5e726c"
fg-line-number = "#859893"
fg-muted = "#7a8d87"
fg-directory = "#0f9c86"
fg-prompt-directory = "#5a6f69"

accent = "#0b7d6b"
accent-on-selection = "#075e50"
cursor = "#0b7d6b"
fg-on-cursor = "#ffffff"

error = "#d13b33"
danger = "#b8312a"
fg-flagged = "#8c201a"
bg-danger = "#c0362f"
bg-danger-kbd = "#96261f"
fg-on-danger = "#ffffff"
warning = "#8f5c00"
fg-on-warning = "#6b4500"
info = "#1679a8"
fg-note-source = "#0f6690"
fg-note-code = "#0b3d58"

fg-added = "#0b6a58"
fg-removed = "#a8231c"

vc-added = "#0b7a66"
vc-modified = "#1679a8"
vc-removed = "#d13b33"
vc-added-on-selection = "#075e50"
vc-removed-on-selection = "#a8231c"

fg-ref-head = "#22609a"
fg-ref-main = "#7344b6"
fg-ref-branch = "#0b7a66"
fg-ref-remote = "#5a6f69"

link = "#1679a8"

# Attributes and macros are both `builtin`.
keyword = "#0a7d68"
type-name = "#22609a"
function = "#865a00"
constant = "#b0482c"
builtin = "#7344b6"
docstring = "#5f756e"
string = "#4b7a14"
comment = "#5f756e"
variable = "#1f4a40"

[styles]
keyword = []
type-name = []
function = []
constant = []
builtin = []
docstring = []
string = []
comment = []
variable = []

[glass]
line-highlight = "#0f9c8612"
region = "#0f9c8633"

vc-added-mark = "#0b7a66b3"
vc-modified-mark = "#1679a8b3"
vc-removed-mark = "#d13b33bf"

surface = "#fcfefdd1"
surface-border = "#10302a1f"

note = "#e3f2f9e0"
note-border = "#1679a859"
note-separator = "#1679a826"
note-code = "#1679a81a"

scrim = "#14282414"

modal = "#fdfffee6"
modal-border = "#10302a1f"
modal-scrim = "#14282429"

pill = "#f0f7f4a6"
pill-border = "#10302a1a"

pane = "#10302a0a"
pane-border = "#10302a17"
well = "#10302a09"
well-border = "#10302a14"
card-border = "#10302a24"
card-footer = "#10302a0a"
divider = "#10302a14"
key-on-control = "#10302a1a"
added = "#c6efdcd9"
removed = "#fbd9d6d9"

field = "#ffffffcc"
control = "#ffffffd9"
control-border = "#10302a24"
chip = "#10302a0f"
selection = "#0f9c8621"
segment = "#ffffffe6"
disabled = "#10302a08"

# Lines, hovers and tints over the glass: teal ink, as the borders are.
[ink]
color = "#10302a"
strength = 1.0

# Light surfaces cast softer shadows.
[shadow]
color = "#10302a"
strength = 0.45
