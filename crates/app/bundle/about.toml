# What `cargo about generate` accepts and reads for THIRD-PARTY-NOTICES, which
# `cargo xtask bundle` writes into the app's Resources.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    # tree-sitter-gitcommit, the Git Commit mode's grammar.
    "WTFPL",
    "Zlib",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-dev-dependencies = true
# remacs's own crates.
private = { ignore = true }
