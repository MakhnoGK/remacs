[package]
name = "remacs-app"
description = "The remacs binary"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "remacs"
path = "src/main.rs"

[features]
default = ["runtime-shaders"]
# Compiles Metal shaders at startup; disable for release builds once Xcode's Metal Toolchain is installed.
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
gpui.workspace = true
remacs-core.workspace = true
remacs-editing.workspace = true
remacs-languages.workspace = true
remacs-theme.workspace = true

[lints]
workspace = true
