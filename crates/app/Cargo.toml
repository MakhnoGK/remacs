[package]
name = "remacs-app"
description = "The remacs binary"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "remacs"
path = "src/main.rs"

[features]
default = []
# Compiles Metal shaders at startup, for building without Xcode's Metal Toolchain
# (`xcodebuild -downloadComponent MetalToolchain`).
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
futures.workspace = true
gpui.workspace = true
remacs-actions.workspace = true
remacs-completion.workspace = true
remacs-config.workspace = true
remacs-core.workspace = true
remacs-diagnostics.workspace = true
remacs-dired.workspace = true
remacs-documentation.workspace = true
remacs-editing.workspace = true
remacs-files.workspace = true
remacs-format.workspace = true
remacs-git.workspace = true
remacs-languages.workspace = true
remacs-lsp.workspace = true
remacs-minibuffer.workspace = true
remacs-debug.workspace = true
remacs-prettier.workspace = true
remacs-rename.workspace = true
remacs-run.workspace = true
remacs-search.workspace = true
remacs-syntax.workspace = true
remacs-terminal.workspace = true
remacs-theme.workspace = true
remacs-tools.workspace = true
remacs-xref.workspace = true
serde.workspace = true

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
