# The built-in major modes: which files each one is for, and how it edits them.
# `modes.toml` adds file names and `#!` programs of one's own.
#
# name           the mode's name, which servers.toml and the grammars use
# extensions     file extensions, without the dot
# file-names     whole file names, for files without a telling extension
# interpreters   programs a `#!` line runs, without their version (`python` for python3.12)
# aliases        other names `-*- mode: … -*-` and vim modelines give it (Emacs's and
#                vim's own names), matched like `name` ignoring case
# first-lines    how a file of no known name begins, ignoring case
# pairs          brackets and quotes typed in pairs, opener first; `<>` only where it
#                opens tags, `''` not where it marks lifetimes or primes, and in prose
#                no quotes
# comment        what comments a line out, `comment-end` after it for block comments;
#                `markup-comment` likewise for lines of markup in code, like JSX children
# indent         the language's usual indentation, a number of spaces or "tabs", for a
#                file not indented yet and no `.editorconfig` telling; else editing.toml's

[[languages]]
name = "Rust"
extensions = ["rs"]
pairs = ["()", "[]", "{}", '""']
comment = "// "

[[languages]]
name = "C"
extensions = ["c", "h"]
pairs = ["()", "[]", "{}", '""', "''"]
comment = "// "

[[languages]]
name = "C++"
extensions = ["cc", "cpp", "cxx", "hh", "hpp", "hxx"]
aliases = ["cpp"]
pairs = ["()", "[]", "{}", '""', "''"]
comment = "// "

[[languages]]
name = "TypeScript"
indent = 2
extensions = ["ts", "mts", "cts"]
interpreters = ["deno", "ts-node"]
aliases = ["ts"]
pairs = ["()", "[]", "{}", '""', "''", "``"]
comment = "// "

[[languages]]
name = "TSX"
indent = 2
extensions = ["tsx"]
aliases = ["typescriptreact"]
pairs = ["()", "[]", "{}", "<>", '""', "''", "``"]
comment = "// "
markup-comment = "{/* "
markup-comment-end = " */}"

