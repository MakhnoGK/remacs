[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
remacs-core = { path = "crates/core" }
remacs-text = { path = "crates/text" }
remacs-theme = { path = "crates/theme" }
remacs-editing = { path = "plugins/editing" }
remacs-files = { path = "plugins/files" }
remacs-languages = { path = "plugins/languages" }
remacs-minibuffer = { path = "plugins/minibuffer" }
remacs-syntax = { path = "plugins/syntax" }

# Without `font-kit` gpui falls back to a no-op text system on macOS.
futures = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
ignore = "0.4"
libc = "0.2"
memchr = "2.7"
memmap2 = "0.9"
notify = "8"
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# gpui is unusably slow at opt-level 0; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
