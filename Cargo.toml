[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "xtask"]
exclude = ["vendor/gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
remacs-config = { path = "crates/config" }
remacs-core = { path = "crates/core" }
remacs-text = { path = "crates/text" }
remacs-theme = { path = "crates/theme" }
remacs-actions = { path = "plugins/actions" }
remacs-completion = { path = "plugins/completion" }
remacs-diagnostics = { path = "plugins/diagnostics" }
remacs-debug = { path = "plugins/debug" }
remacs-dired = { path = "plugins/dired" }
remacs-documentation = { path = "plugins/documentation" }
remacs-editing = { path = "plugins/editing" }
remacs-files = { path = "plugins/files" }
remacs-format = { path = "plugins/format" }
remacs-git = { path = "plugins/git" }
remacs-languages = { path = "plugins/languages" }
remacs-lsp = { path = "plugins/lsp" }
remacs-minibuffer = { path = "plugins/minibuffer" }
remacs-prettier = { path = "plugins/prettier" }
remacs-rename = { path = "plugins/rename" }
remacs-run = { path = "plugins/run" }
remacs-search = { path = "plugins/search" }
remacs-syntax = { path = "plugins/syntax" }
remacs-terminal = { path = "plugins/terminal" }
remacs-tools = { path = "plugins/tools" }
remacs-xref = { path = "plugins/xref" }

alacritty_terminal = { version = "0.26", default-features = false }
# Without `font-kit` gpui falls back to a no-op text system on macOS.
futures = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
ignore = "0.4"
imara-diff = "0.2"
libc = "0.2"
lsp-types = "0.97"
memchr = "2.7"
memmap2 = "0.9"
notify = "8"
# Without `unicode-segmentation`, match indices count chars rather than graphemes.
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
trash = { version = "5.2", default-features = false }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cmake = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-haskell = "0.24"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-language = "0.1"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"

# gpui patched for thin and thick text strokes; see docs/adr/0034-text-strokes.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# gpui is unusably slow at opt-level 0; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
