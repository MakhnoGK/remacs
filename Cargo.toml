[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
remacs-text = { path = "crates/text" }
remacs-theme = { path = "crates/theme" }

# Without `font-kit` gpui falls back to a no-op text system on macOS.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
libc = "0.2"
memchr = "2.7"
memmap2 = "0.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# gpui is unusably slow at opt-level 0; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
