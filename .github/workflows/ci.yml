name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned so a new release's clippy lints fail a deliberate bump, not unrelated pull requests.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # gpui compiles its Metal shaders at build time; Xcode 26 and later ship the Metal toolchain as a separate download.
      - name: Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # gpui's Wayland and X11 windows and its Vulkan renderer; zsh for the terminal's shell tests.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libzstd-dev zsh
      - run: cargo build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
