name: Audit

# Checks Cargo.lock against the RustSec advisories; weekly too, as new ones come out for
# dependencies that did not change. Fails on vulnerabilities, warns on unmaintained crates.
# No path filter: a required check has to run on every pull request.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit
      - run: cargo audit
