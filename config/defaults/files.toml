# What find-file and project-search leave out, how buffers are killed and follow their
# files. Changes apply as soon as the file is saved.

# Files and folders, in .gitignore syntax: "name/" a folder anywhere, "/name" only at the
# project's root, "*.min.js" a glob. .git/ is always left out.
ignore = ["node_modules/", "target/", "dist/", "build/", ".next/", ".DS_Store"]

# Also leave out what the project's .gitignore files do; off, so .env and the like are
# found.
use-gitignore = false

# C-x k asks which buffer to kill; off, it kills the current one at once (still asking
# first if it has unsaved changes).
kill-buffer-prompt = true

# A buffer without unsaved changes reads its file again when another program changes it.
# Off, it still does after remacs's own Git actions and when the file is visited again;
# saving over a file changed since it was read always asks first.
auto-revert = true
