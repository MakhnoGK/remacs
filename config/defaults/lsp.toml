# Language servers: changes to the built-in ones, by name, and servers of your own. The
# built-in catalog is plugins/languages/servers.toml in the remacs sources; an entry here
# changes only what it names, and a server that changes restarts. A new name with a
# `command` and `languages` adds a server, in the same form as the catalog's.
#
# A server is looked for in the project's node_modules (linters), then on PATH, then
# among those remacs downloaded (tools.toml); one found older than the server's
# `min-version` (tsc's 7), as its `--version` says, is passed over. One a project wants
# that is nowhere is offered for download, once per project; of a group of alternatives
# (Python's), you choose one. Edit ▸ Download Language Servers offers them again, the
# Tools panel (C-c t) downloads any. One remacs cannot download is passed over in silence.
offer-downloads = true

# Whether code of other languages in a file, like CSS and scripts in HTML, goes to their
# servers too: completed, checked, explained and formatted by them. Off, the file's server
# alone has it, and the HTML server still leaves checking it to theirs.
embedded-code = true

# Whether typing a call's `(`, or what else its server starts arguments with, shows the
# call's signature above the line, the parameter being typed in bold; it follows the call
# until point leaves it. Off, ⌘P (signature-help) shows it, and again the next overload.
signature-help-on-typing = true

# Whether what a server knows each name to be (its semantic tokens) paints over the faces
# tree-sitter gives it: a constant named in lowercase, a call through a variable. They
# follow syntax.toml's highlight-level, and local-variables for parameters and variables.
semantic-tokens = true

# The capture of syntax.toml's scheme each token type takes, as `type` or `"type.modifier"`
# for a modifier that changes it; "" paints nothing, leaving tree-sitter's face. What you
# name here goes over these, the built-in ones: the LSP's own types, then rust-analyzer's
# and TypeScript's. Types left out, like comment, string, number and keyword, paint
# nothing: tree-sitter tells them, and paints the TODOs in comments too.
[semantic-token-captures]
# namespace = ""
# type = "type"
# class = "type"
# enum = "type"
# interface = "type"
# struct = "type"
# typeParameter = "type"
# parameter = "variable"
# variable = "variable"
# "variable.constant" = "constant"
# "variable.static" = "constant"
# property = ""
# enumMember = "constant"
# event = ""
# function = "function.call"
# "function.declaration" = "function"
# "function.definition" = "function"
# method = "function.call"
# "method.declaration" = "function"
# "method.definition" = "function"
# macro = "function.macro"
# decorator = "attribute"
# label = "label"
# attribute = "attribute"
# builtinAttribute = "attribute"
# builtinType = "type.builtin"
# const = "constant"
# constParameter = "constant"
# derive = "type"
# deriveHelper = "attribute"
# formatSpecifier = ""
# generic = ""
# lifetime = "label"
# macroBang = "function.macro"
# procMacro = "function.macro"
# selfKeyword = "variable.builtin"
# selfTypeKeyword = "type"
# static = "constant"
# toolModule = ""
# typeAlias = "type"
# union = "type"
# unresolvedReference = ""

# [servers.rust-analyzer]
# command = "~/bin/rust-analyzer"    # a path, or a name looked up on PATH, run as it is
# args = []
# enabled = true
# initialization-options = { check = { command = "clippy" } }
# configuration = {}                 # answered for workspace/configuration
#
# [servers.tsc]
# min-version = 7                    # a tsc found older is passed over; 0 takes any
# unless = { older = { typescript = 7 } }   # leaves alone projects whose own TypeScript
#                                    # is older, served by typescript-language-server
#
# [servers.oxfmt]
# formats-first = false              # leave formatting to tsc
# env = { VP_VERSION = "1" }         # added to its environment where env-when holds
# env-when = { dependencies = ["vite-plus"] }
#
# [servers.eslint]
# enabled = false
#
# [servers.harper-ls]                # off until turned on, like emmet
# enabled = true
#
# [servers.tailwindcss]              # a Tailwind 4 project without a package.json
# when = { files = ["src/app.css"] }
# configuration = { classFunctions = ["cn", "clsx", "tv"] }   # whose strings hold classes
#
# [servers.vue-language-server]
# tsserver = "vtsls"                 # the server of the project its scripts' TypeScript is asked of;
#                                    # it must serve Vue too, else Vue is answered nothing
#
# [servers.jedi]                     # a server of your own, one more Python choice
# command = "jedi-language-server"
# languages = { Python = "python" }
# group = "python"
# install = { from = "pip", package = "jedi-language-server" }
